name: Desktop app release

# Builds Netprobe Desktop for Windows, macOS (Apple Silicon + Intel) and Linux.
# Push a tag like desktop-v1.0.0 to build and publish a GitHub Release, or run it
# manually from the Actions tab to just get the build artifacts.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: |
              desktop/dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: |
              desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # No signing certificates: builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: netprobe-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Netprobe Desktop ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
